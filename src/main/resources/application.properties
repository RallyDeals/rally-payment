# ===================================================================
spring.application.name=rally-payment
server.port=${SERVER_PORT:8089}
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Database (local defaults: host Postgres mapped to 5433 by docker-compose)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:payment_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# Flyway Migration Settings
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Apache Kafka
# ===================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer Configurations
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rally.payment.events,com.rally.payment.messaging.contract
spring.kafka.consumer.properties.spring.json.value.default.type=com.fasterxml.jackson.databind.JsonNode
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka observation: creates OTel spans for consumer/producer and auto-propagates
# the W3C traceparent header, so spans link across services without manual headers.
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# ===================================================================
# Stripe API & Webhook Configuration
# ===================================================================
stripe.api-key=${STRIPE_API_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.webhook-path=${STRIPE_WEBHOOK_PATH:/api/v1/payments/webhook}
stripe.currency=egp

# ===================================================================
# Outbox Relay Configuration
# ===================================================================
outbox.relay.poll-interval-ms=1000
outbox.relay.batch-size=100
outbox.relay.health-stale-ms=300000

# ===================================================================
# Logging
# Default levels are tuned to reduce noise. Business code (com.rally.payment)
# stays at INFO; framework/Hibernate/Kafka/Spring are raised to reduce clutter.
# ===================================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Application business logs (keep DEBUG only if you truly need fine-grained output)
logging.level.com.rally.payment=${LOGGING_LEVEL_RALLY:INFO}

# Hibernate / JPA: silence SQL, bind params, transactions, and batch commits
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:WARN}
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.engine.jdbc.batch=OFF
logging.level.org.hibernate.engine.transaction=OFF
logging.level.org.hibernate.resource.transaction=OFF

# Kafka: quiet the consumer/client internals (rebalancing, polls, heartbeats)
logging.level.org.apache.kafka=${LOGGING_LEVEL_KAFKA:WARN}
logging.level.org.apache.kafka.clients.consumer=${LOGGING_LEVEL_KAFKA_CONSUMER:OFF}
logging.level.org.apache.kafka.clients.producer=${LOGGING_LEVEL_KAFKA_PRODUCER:OFF}
logging.level.org.apache.kafka.clients.NetworkClient=OFF
logging.level.kafka=OFF

# Spring Kafka listener container (consumer group/assignment churn)
logging.level.org.springframework.kafka=${LOGGING_LEVEL_SPRING_KAFKA:WARN}
logging.level.org.springframework.kafka.listener=${LOGGING_LEVEL_SPRING_KAFKA_LISTENER:WARN}

# Spring Boot startup / framework noise
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:WARN}
logging.level.org.springframework.boot=${LOGGING_LEVEL_SPRING_BOOT:WARN}

# Flyway
logging.level.org.flywaydb=WARN

# ===================================================================
# Actuator & Observability & Tracing
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.metrics.tags.application=${spring.application.name}
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# W3C baggage: carry orderId and X-Correlation-Id across services and surface them
# in logs (MDC) and spans, so they are searchable in Jaeger by tag.
management.tracing.baggage.remote-fields=X-Correlation-Id
management.tracing.baggage.correlation.fields=X-Correlation-Id
management.tracing.baggage.tag-fields=X-Correlation-Id

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html